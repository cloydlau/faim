shellEmulator: true

trustPolicy: no-downgrade
# 发布时间超过该分钟数的历史版本豁免 trust 降级检查。
# semver@6.3.1 等老版本发布于 npm provenance 出现之前，属误报；真正的包劫持是新发布版本，仍会被拦截。
trustPolicyIgnoreAfter: 10080

packages:
  - '*'
allowBuilds:
  '@code-inspector/core': true
  '@parcel/watcher': true
  axios-shortcut: true
  core-js: true
  esbuild: true
  json-editor-vue: true
  node-pty: true
  simple-git-hooks: true
  vue-demi: true
  vue-global-config: true
